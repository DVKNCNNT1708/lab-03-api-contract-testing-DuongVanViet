openapi: 3.1.0

info:
  title: Smart Campus — IoT Ingestion API
  version: 0.3.0
  description: |
    Contract mẫu dùng cho FIT4110 Lab 03 — Postman, Mock Server và Contract Testing.
  contact:
    name: Team IoT
    email: team-iot@example.com

servers:
  - url: http://localhost:4010
    description: Prism mock server

  - url: http://localhost:8000
    description: Local development server

tags:
  - name: readings
    description: Sensor telemetry ingestion

  - name: system
    description: Health and runtime information

security:
  - bearerAuth: []

paths:

  /health:
    get:
      tags:
        - system

      operationId: getHealth

      summary: Kiểm tra trạng thái service

      security: []

      responses:
        "200":
          description: Service đang hoạt động

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

              examples:
                ok:
                  value:
                    status: ok
                    service: iot-ingestion
                    version: 0.3.0

  /readings:
    post:
      tags:
        - readings

      operationId: createReading

      summary: Gửi telemetry từ thiết bị IoT

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorReadingCreate"

            examples:
              valid_temperature:
                value:
                  device_id: ESP32-LAB-A01
                  metric: temperature
                  value: 31.5
                  unit: celsius
                  timestamp: "2026-05-13T08:30:00+07:00"

      responses:

        "201":
          description: Đã ghi nhận bản đọc cảm biến

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorReadingCreated"

              examples:
                created:
                  value:
                    reading_id: R-20260513-0001
                    device_id: ESP32-LAB-A01
                    metric: temperature
                    accepted: true
                    created_at: "2026-05-13T08:30:01+07:00"

        "400":
          description: Request không hợp lệ

          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "401":
          description: Unauthorized

          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "429":
          description: Too many requests

          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /readings/latest:
    get:
      tags:
        - readings

      operationId: getLatestReadings

      summary: Lấy bản ghi mới nhất

      parameters:

        - in: query
          name: device_id

          schema:
            type: string

        - in: query
          name: limit

          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

      responses:

        "200":
          description: Danh sách bản ghi mới nhất

          content:
            application/json:
              schema:
                type: object

                required:
                  - items

                properties:

                  items:
                    type: array

                    items:
                      $ref: "#/components/schemas/SensorReading"

              examples:
                latest:
                  value:
                    items:
                      - reading_id: R-20260513-0001
                        device_id: ESP32-LAB-A01
                        metric: temperature
                        value: 31.5
                        unit: celsius
                        timestamp: "2026-05-13T08:30:00+07:00"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    SensorMetric:
      type: string

      enum:
        - temperature
        - humidity
        - motion
        - smoke

    SensorReadingCreate:
      type: object

      required:
        - device_id
        - metric
        - value
        - timestamp

      properties:

        device_id:
          type: string
          minLength: 3
          example: ESP32-LAB-A01

        metric:
          $ref: "#/components/schemas/SensorMetric"

        value:
          type: number
          minimum: -40
          maximum: 80
          example: 31.5

        unit:
          type: string

          enum:
            - celsius
            - percent
            - boolean
            - ppm

          example: celsius

        timestamp:
          type: string
          format: date-time

          example: "2026-05-13T08:30:00+07:00"

    SensorReading:
      type: object

      required:
        - reading_id
        - device_id
        - metric
        - value
        - timestamp

      properties:

        reading_id:
          type: string
          example: R-20260513-0001

        device_id:
          type: string
          example: ESP32-LAB-A01

        metric:
          $ref: "#/components/schemas/SensorMetric"

        value:
          type: number
          example: 31.5

        unit:
          type: string
          example: celsius

        timestamp:
          type: string
          format: date-time

    SensorReadingCreated:
      type: object

      required:
        - reading_id
        - device_id
        - metric
        - accepted
        - created_at

      properties:

        reading_id:
          type: string
          example: R-20260513-0001

        device_id:
          type: string
          example: ESP32-LAB-A01

        metric:
          $ref: "#/components/schemas/SensorMetric"

        accepted:
          type: boolean
          example: true

        created_at:
          type: string
          format: date-time

    HealthResponse:
      type: object

      required:
        - status
        - service
        - version

      properties:

        status:
          type: string
          enum:
            - ok

        service:
          type: string

        version:
          type: string

    ProblemDetails:
      type: object

      required:
        - type
        - title
        - status

      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer
          minimum: 400
          maximum: 599

        detail:
          type: string

        instance:
          type: string